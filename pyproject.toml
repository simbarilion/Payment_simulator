[project]
name = "payment-simulator"
version = "0.1.0"
description = "Service that processes a payment transaction through an external provider and maintains the correct state across retries, concurrent requests, lost HTTP responses, and restarts"
authors = [
    {name = "simbarilion",email = "nadezhda13popova@gmail.com"}
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi (>=0.139.2,<0.140.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "poetry-core (>=2.4.1,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "aiosqlite (>=0.21.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "httpx (>=0.28.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "ruff (>=0.16.0,<0.17.0)",
    "pre-commit (>=4.6.1,<5.0.0)",
    "mypy (>=2.3.0,<3.0.0)"
]
test = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.ruff]
line-length = 119
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "env",
    ".env",
    "alembic/versions",
    "alembic/env.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

ignore = [
    "E203",
    "E701",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"alembic/versions/*.py" = ["E501", "F401", "E402", "W291"]

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = true

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

ignore_missing_imports = true

exclude = [
    "venv",
    ".venv",
    "env",
    ".env",
    ".git",
    "__pycache__",
    "^alembic/",
    "^alembic/.*",
    "^tests/",
    ".*\\.env.*",
    "^\\.venv/",
    ".*\\.ini",
    ".*\\.cfg",
    ".*\\.example",
]

[[tool.mypy.overrides]]
module = ["tests.*",]
ignore_errors = true

[tool.coverage.run]
source = ["app"]
omit = [
    "app/main.py",
    "app/scripts/*",
    "app/db/migrations/*",
    "app/alembic/*",
    "app/schemas/common.py",
    "app/api/routers/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
