services:
  candidate-service:
    build: .
    environment:
      PROVIDER_URL: http://provider-simulator:8081
      DATA_DIR: /data
      SQLITE_FILENAME: payments.db
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      PROVIDER_MAX_ATTEMPTS: "3"
      PROVIDER_RETRY_BASE_DELAY_SECONDS: "0.2"
    ports:
      - "8080:8080"
    volumes:
      - candidate-data:/data

  provider-simulator:
    image: ghcr.io/fintech-dev-lab/internship-provider-simulator:v0.2.0
    environment:
      CALLBACK_URL: http://candidate-service:8080/receipts
    ports:
      - "8081:8081"
    depends_on:
      - candidate-service

volumes:
  candidate-data:
